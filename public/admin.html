<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Ujian Fisika</title>
  <link rel="stylesheet" href="/shared/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tabs button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; }

    /* ─── Question editor ─── */
    .stage-section { margin-bottom: 24px; }
    .stage-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(90deg, #eff6ff, #f8fafc);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .stage-header .stage-icon { font-size: 20px; }
    .stage-header .stage-name { font-weight: 700; font-size: 15px; color: var(--ink); }
    .stage-header .stage-count { margin-left: auto; font-size: 12px; color: var(--ink-soft); }
    .stage-header .stage-add { font-size: 12px; padding: 5px 10px; }

    .q-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .q-card:hover { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .q-card.editing { border-color: var(--accent); box-shadow: 0 4px 16px rgba(37,99,235,.15); }

    .q-card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .q-card-header .order-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      background: var(--accent); color: #fff;
      border-radius: 50%;
      font-weight: 700; font-size: 11px;
    }
    .q-card-header .type-label { font-weight: 600; color: var(--ink); }
    .q-card-header .actions { margin-left: auto; display: flex; gap: 6px; }
    .q-card-header .actions button { padding: 4px 10px; font-size: 12px; }

    .q-card-body { padding: 12px 16px; }
    .q-card-body .question-text { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--ink); }
    .q-card-body .options-preview { list-style: none; padding: 0; margin: 0; font-size: 13px; }
    .q-card-body .options-preview li {
      padding: 6px 10px; margin: 4px 0;
      border-radius: 6px; background: #f8fafc;
      display: flex; align-items: center; gap: 8px;
    }
    .q-card-body .options-preview li.correct { background: #dcfce7; color: #166534; font-weight: 500; }
    .q-card-body .options-preview .mark { font-weight: 700; }
    .q-card-body .hint-text { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 4px; }

    /* Edit form */
    .q-edit-form { padding: 16px; border-top: 1px solid var(--border); background: #fafbfc; }
    .q-edit-form .field { margin-bottom: 12px; }
    .q-edit-form label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
    .q-edit-form textarea { min-height: 60px; resize: vertical; }
    .q-edit-form .options-list { display: flex; flex-direction: column; gap: 6px; }
    .q-edit-form .option-row {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
    }
    .q-edit-form .option-row.correct-row { border-color: #16a34a; background: #f0fdf4; }
    .q-edit-form .option-row input[type=text] { flex: 1; border: none; outline: none; font-size: 13px; padding: 4px 6px; background: transparent; }
    .q-edit-form .option-row .opt-mark {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; color: var(--ink-soft);
    }
    .q-edit-form .option-row .del-opt {
      background: transparent; border: none; color: var(--bad); cursor: pointer;
      font-size: 16px; padding: 0 6px;
    }
    .q-edit-form .add-opt {
      align-self: flex-start;
      background: transparent; color: var(--accent);
      border: 1px dashed var(--accent); padding: 6px 12px; border-radius: 8px;
      font-size: 12px; cursor: pointer; font-weight: 600;
    }
    .q-edit-form .tf-toggle { display: flex; gap: 8px; }
    .q-edit-form .tf-toggle button {
      flex: 1; padding: 10px; border-radius: 8px; border: 2px solid var(--border);
      background: #fff; cursor: pointer; font-weight: 600;
    }
    .q-edit-form .tf-toggle button.active.t { border-color: #16a34a; background: #dcfce7; color: #166534; }
    .q-edit-form .tf-toggle button.active.f { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
    .q-edit-form .wb-hint {
      background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 6px;
      font-size: 12px; margin-bottom: 8px;
    }
    .q-edit-form .form-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      padding-top: 8px; border-top: 1px solid var(--border); margin-top: 12px;
    }
    .q-edit-form .json-advanced {
      margin-top: 10px; padding: 8px;
      background: #1e293b; border-radius: 6px;
    }
    .q-edit-form .json-advanced summary { color: #cbd5e1; font-size: 11px; cursor: pointer; padding: 4px; }
    .q-edit-form .json-advanced pre { margin: 6px 0 0; font-size: 11px; max-height: 200px; }

    /* New question wizard */
    .new-q-modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .new-q-modal .modal-card {
      background: #fff; border-radius: 14px; padding: 24px;
      max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .new-q-modal h3 { margin-top: 0; }
    .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .type-grid button {
      padding: 12px; border-radius: 8px; border: 2px solid var(--border);
      background: #fff; cursor: pointer; text-align: left;
    }
    .type-grid button:hover { border-color: var(--accent); background: #eff6ff; }
    .type-grid button .t-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    .type-grid button .t-label { font-weight: 600; font-size: 13px; display: block; }
    .type-grid button .t-stage { font-size: 11px; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="nav">
    <div class="brand">Admin Ujian Fisika</div>
    <div class="row" id="nav-right"></div>
  </div>

  <div class="container" id="login-view">
    <div class="card" style="max-width: 420px; margin: 60px auto;">
      <h1>Login Guru</h1>
      <div id="login-err" class="banner err" style="display:none;"></div>
      <div class="field"><label>Username</label><input class="input" id="adm-user" /></div>
      <div class="field"><label>Password</label><input class="input" type="password" id="adm-pass" /></div>
      <button class="btn" id="adm-login" style="width:100%;">Masuk</button>
    </div>
  </div>

  <div class="container" id="app-view" style="display:none;">
    <div class="tabs">
      <button data-tab="students" class="active">Siswa</button>
      <button data-tab="questions">Soal</button>
      <button data-tab="responses">Jawaban</button>
      <button data-tab="summary">Ringkasan</button>
    </div>

    <div id="tab-students" class="tab-panel">
      <div class="card">
        <h2>Unggah Daftar Siswa (CSV)</h2>
        <p class="muted">Format kolom: <code>nis, examinee_no, name, class_name</code></p>
        <div class="row">
          <input type="file" id="csv-file" accept=".csv" />
          <button class="btn" id="csv-upload">Unggah</button>
        </div>
        <div id="csv-msg" style="margin-top:10px;"></div>
        <h2 style="margin-top:20px;">Daftar Siswa</h2>
        <div id="students-table"></div>
      </div>
    </div>

    <div id="tab-questions" class="tab-panel" style="display:none;">
      <div class="card">
        <h2>Editor Soal</h2>
        <p class="muted" style="margin-top:-8px;">Satu daftar soal per simulasi — campur jenis soal apa pun, urutkan bebas dengan tombol ↑↓.</p>
        <div class="row" style="margin-bottom: 16px; align-items: center;">
          <label><strong>Simulasi:</strong></label>
          <select id="q-sim" style="min-width: 240px;"></select>
          <button class="btn btn-secondary" id="preview-sim-btn" title="Buka simulasi ini beserta soalnya untuk dicoba — jawaban tidak direkam">🔍 Preview Sim</button>
        </div>
        <div id="q-list"></div>
      </div>
    </div>

    <div id="tab-responses" class="tab-panel" style="display:none;">
      <div class="card">
        <h2>Jawaban Siswa</h2>
        <div class="row" style="margin-bottom:10px;">
          <a class="btn" href="/api/admin/responses.csv">⬇ Unduh CSV</a>
        </div>
        <div id="resp-table"></div>
      </div>
    </div>

    <div id="tab-summary" class="tab-panel" style="display:none;">
      <div class="card">
        <h2>Ringkasan Progress</h2>
        <div id="summary-table"></div>
      </div>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script>
    let sims = [];

    async function checkAuth() {
      const me = await API.get('/api/auth/me');
      if (me.authenticated && me.role === 'admin') showApp();
      else showLogin();
    }
    function showLogin() {
      document.getElementById('login-view').style.display = '';
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('nav-right').innerHTML = '';
    }
    function showApp() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = '';
      document.getElementById('nav-right').innerHTML = '<button class="btn btn-secondary" id="logout">Keluar</button>';
      document.getElementById('logout').addEventListener('click', async () => {
        await API.post('/api/auth/logout'); showLogin();
      });
      loadAll();
    }

    document.getElementById('adm-login').addEventListener('click', async () => {
      const err = document.getElementById('login-err');
      err.style.display = 'none';
      try {
        await API.post('/api/auth/admin/login', {
          username: document.getElementById('adm-user').value,
          password: document.getElementById('adm-pass').value
        });
        showApp();
      } catch (ex) { err.textContent = ex.message; err.style.display = 'block'; }
    });

    document.querySelectorAll('.tabs button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
        document.getElementById('tab-' + b.dataset.tab).style.display = '';
      });
    });

    async function loadAll() {
      const s = await API.get('/api/admin/sims'); sims = s.sims;
      const sel = document.getElementById('q-sim');
      sel.innerHTML = sims.map(x => `<option value="${x.sim_key}">${x.title}</option>`).join('');
      sel.addEventListener('change', loadQuestions);

      document.getElementById('preview-sim-btn').addEventListener('click', () => {
        const key = document.getElementById('q-sim').value;
        if (key) window.open(`/sim.html?key=${encodeURIComponent(key)}&preview=1`, '_blank');
      });

      await Promise.all([loadStudents(), loadQuestions(), loadResponses(), loadSummary()]);
    }

    async function loadStudents() {
      const { students } = await API.get('/api/admin/students');
      const html = `
        <div class="row" style="margin-bottom:10px;">
          <button class="btn btn-bad" id="reset-all-btn">⟲ Reset SEMUA Jawaban</button>
        </div>
        <table><thead><tr><th>NIS</th><th>No Peserta</th><th>Nama</th><th>Kelas</th><th>Aksi</th></tr></thead><tbody>
        ${students.map(s => `<tr>
          <td>${s.nis}</td><td>${s.examinee_no}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.class_name||'')}</td>
          <td>
            <button class="btn btn-secondary reset-btn" data-id="${s.id}" data-name="${escapeHtml(s.name)}">⟲ Reset</button>
            <button class="btn btn-bad del-btn" data-id="${s.id}">Hapus</button>
          </td>
        </tr>`).join('')}
        </tbody></table>
      `;
      document.getElementById('students-table').innerHTML = html;

      document.querySelectorAll('#students-table .del-btn').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Hapus siswa ini?')) return;
        await API.del('/api/admin/students/' + b.dataset.id);
        loadStudents();
      }));
      document.querySelectorAll('#students-table .reset-btn').forEach(b => b.addEventListener('click', async () => {
        if (!confirm(`Reset semua jawaban untuk ${b.dataset.name}? Siswa akan mulai dari simulasi pertama.`)) return;
        const r = await API.post('/api/admin/students/' + b.dataset.id + '/reset');
        alert(`Reset selesai. ${r.deleted} jawaban dihapus.`);
        loadStudents();
        loadSummary();
      }));
      document.getElementById('reset-all-btn').addEventListener('click', async () => {
        if (!confirm('⚠ Reset SEMUA jawaban dari SEMUA siswa? Tidak bisa dibatalkan.')) return;
        if (!confirm('Yakin? Ketik OK pada prompt berikutnya untuk konfirmasi.')) return;
        const t = prompt('Ketik "RESET" untuk konfirmasi:');
        if (t !== 'RESET') return;
        const r = await API.post('/api/admin/responses/reset-all');
        alert(`Reset selesai. ${r.deleted} jawaban dihapus.`);
        loadSummary(); loadResponses();
      });
    }

    document.getElementById('csv-upload').addEventListener('click', async () => {
      const f = document.getElementById('csv-file').files[0];
      if (!f) return;
      const msg = document.getElementById('csv-msg');
      try {
        const r = await API.upload('/api/admin/students/upload', f);
        msg.innerHTML = `<div class="banner ok">Berhasil: ${r.inserted} baru, ${r.updated} diperbarui.</div>`;
        loadStudents();
      } catch (ex) {
        msg.innerHTML = `<div class="banner err">${ex.message}</div>`;
      }
    });

    // ─── Question editor (Google Forms style) ─────────────────────────
    // stage is derived from type; it remains in the DB for analytics/back-compat.
    const TYPE_META = {
      tutorial_step: { label: 'Langkah Tutorial', icon: '📖', stage: 'tutorial' },
      var_test:      { label: 'Uji Variabel',     icon: '🔬', stage: 'var_test' },
      simple_mc:     { label: 'Pilihan Ganda',    icon: '◉',  stage: 'inquiry' },
      complex_mc:    { label: 'PG Kompleks',      icon: '☑',  stage: 'inquiry' },
      true_false:    { label: 'Benar / Salah',    icon: '✓✗', stage: 'true_false' },
      word_bank:     { label: 'Isian Bank Kata',  icon: '🧩', stage: 'conclusion' }
    };

    function defaultPayload(type) {
      switch (type) {
        case 'tutorial_step': return { title: '', body: '' };
        case 'var_test':      return { prompt: '', hint: '' };
        case 'simple_mc':     return { question: '', options: ['', '', '', ''], answer: 0 };
        case 'complex_mc':    return { question: '', options: ['', '', '', ''], answers: [] };
        case 'true_false':    return { statement: '', answer: true };
        case 'word_bank':     return { template: '', bank: ['', '', ''], blanks: [] };
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderPreview(q) {
      const p = q.payload || {};
      switch (q.type) {
        case 'tutorial_step':
          return `<div class="question-text">${escapeHtml(p.title || '(tanpa judul)')}</div>
                  <div style="color:#475569;font-size:13px;">${escapeHtml(p.body || '')}</div>`;
        case 'var_test':
          return `<div class="question-text">${escapeHtml(p.prompt || '(tanpa prompt)')}</div>
                  ${p.hint ? `<div class="hint-text">💡 ${escapeHtml(p.hint)}</div>` : ''}`;
        case 'simple_mc': {
          const opts = (p.options || []).map((o, i) => `
            <li class="${i === p.answer ? 'correct' : ''}">
              <span class="mark">${i === p.answer ? '◉' : '○'}</span> ${escapeHtml(o)}
            </li>`).join('');
          return `<div class="question-text">${escapeHtml(p.question || '')}</div>
                  <ul class="options-preview">${opts}</ul>`;
        }
        case 'complex_mc': {
          const ans = new Set(p.answers || []);
          const opts = (p.options || []).map((o, i) => `
            <li class="${ans.has(i) ? 'correct' : ''}">
              <span class="mark">${ans.has(i) ? '☑' : '☐'}</span> ${escapeHtml(o)}
            </li>`).join('');
          return `<div class="question-text">${escapeHtml(p.question || '')}</div>
                  <ul class="options-preview">${opts}</ul>`;
        }
        case 'true_false':
          return `<div class="question-text">${escapeHtml(p.statement || '')}</div>
                  <div style="color: ${p.answer ? '#16a34a' : '#dc2626'}; font-weight: 600; font-size: 13px;">
                    Jawaban: ${p.answer ? '✓ Benar' : '✗ Salah'}
                  </div>`;
        case 'word_bank': {
          const filledTemplate = (p.template || '').replace(/__(\d+)__/g, (_, n) => {
            const idx = parseInt(n, 10) - 1;
            const w = (p.blanks || [])[idx];
            return `<span style="background:#dcfce7;color:#166534;padding:2px 6px;border-radius:4px;font-weight:600;">${escapeHtml(w || `[${n}]`)}</span>`;
          });
          return `<div class="question-text">${filledTemplate}</div>
                  <div class="hint-text">Bank kata: ${(p.bank || []).map(escapeHtml).join(', ')}</div>`;
        }
      }
      return '<em>tipe tidak dikenal</em>';
    }

    function renderForm(q) {
      const p = q.payload || {};
      switch (q.type) {
        case 'tutorial_step':
          return `
            <div class="field"><label class="field-label">Judul</label>
              <input class="input" data-field="title" value="${escapeHtml(p.title || '')}" /></div>
            <div class="field"><label class="field-label">Isi penjelasan</label>
              <textarea class="input" data-field="body" rows="4">${escapeHtml(p.body || '')}</textarea></div>`;

        case 'var_test':
          return `
            <div class="field"><label class="field-label">Instruksi eksperimen</label>
              <textarea class="input" data-field="prompt" rows="3">${escapeHtml(p.prompt || '')}</textarea></div>
            <div class="field"><label class="field-label">Petunjuk (opsional)</label>
              <input class="input" data-field="hint" value="${escapeHtml(p.hint || '')}" /></div>`;

        case 'simple_mc': {
          const opts = (p.options || []).map((o, i) => optionRow(i, o, i === p.answer, 'simple_mc')).join('');
          return `
            <div class="field"><label class="field-label">Pertanyaan</label>
              <textarea class="input" data-field="question" rows="3">${escapeHtml(p.question || '')}</textarea></div>
            <div class="field"><label class="field-label">Pilihan jawaban (centang yang benar)</label>
              <div class="options-list" data-list="options">${opts}</div>
              <button type="button" class="add-opt" data-add="option">+ Tambah pilihan</button>
            </div>`;
        }

        case 'complex_mc': {
          const ans = new Set(p.answers || []);
          const opts = (p.options || []).map((o, i) => optionRow(i, o, ans.has(i), 'complex_mc')).join('');
          return `
            <div class="field"><label class="field-label">Pertanyaan</label>
              <textarea class="input" data-field="question" rows="3">${escapeHtml(p.question || '')}</textarea></div>
            <div class="field"><label class="field-label">Pilihan jawaban (centang SEMUA yang benar)</label>
              <div class="options-list" data-list="options">${opts}</div>
              <button type="button" class="add-opt" data-add="option">+ Tambah pilihan</button>
            </div>`;
        }

        case 'true_false':
          return `
            <div class="field"><label class="field-label">Pernyataan</label>
              <textarea class="input" data-field="statement" rows="2">${escapeHtml(p.statement || '')}</textarea></div>
            <div class="field"><label class="field-label">Jawaban benar:</label>
              <div class="tf-toggle">
                <button type="button" data-tf="true"  class="${p.answer === true  ? 'active t' : ''}">✓ Benar</button>
                <button type="button" data-tf="false" class="${p.answer === false ? 'active f' : ''}">✗ Salah</button>
              </div>
            </div>`;

        case 'word_bank': {
          const bank   = (p.bank   || []).map((w, i) => wbWordRow(i, w, 'bank')).join('');
          const blanks = (p.blanks || []).map((w, i) => wbWordRow(i, w, 'blanks')).join('');
          return `
            <div class="wb-hint">
              💡 Gunakan <code>__1__</code>, <code>__2__</code>, dst. di template untuk menandai bagian yang harus diisi siswa.
              Daftar "Jawaban" di bawah harus berurutan sesuai nomor blank.
            </div>
            <div class="field"><label class="field-label">Template kalimat</label>
              <textarea class="input" data-field="template" rows="3" placeholder="Contoh: Hukum Newton II berbunyi __1__ × __2__ = F.">${escapeHtml(p.template || '')}</textarea></div>
            <div class="field"><label class="field-label">Bank kata (kata-kata pilihan yang ditampilkan)</label>
              <div class="options-list" data-list="bank">${bank}</div>
              <button type="button" class="add-opt" data-add="bank">+ Tambah kata</button>
            </div>
            <div class="field"><label class="field-label">Jawaban (kata yang benar untuk tiap blank, urut __1__, __2__, …)</label>
              <div class="options-list" data-list="blanks">${blanks}</div>
              <button type="button" class="add-opt" data-add="blanks">+ Tambah jawaban</button>
            </div>`;
        }
      }
      return '<em>tipe tidak dikenal</em>';
    }

    function optionRow(i, val, isCorrect, type) {
      const markName = type === 'simple_mc' ? 'radio' : 'checkbox';
      const inputName = type === 'simple_mc' ? `name="correct"` : '';
      return `
        <div class="option-row ${isCorrect ? 'correct-row' : ''}">
          <label class="opt-mark">
            <input type="${markName}" ${inputName} class="opt-correct" ${isCorrect ? 'checked' : ''} />
            <span>Benar</span>
          </label>
          <input type="text" class="opt-text" value="${escapeHtml(val || '')}" placeholder="Pilihan jawaban..." />
          <button type="button" class="del-opt" title="Hapus pilihan">×</button>
        </div>`;
    }
    function wbWordRow(i, val, kind) {
      return `
        <div class="option-row">
          <span class="opt-mark" style="min-width:40px;">${kind === 'blanks' ? `__${i+1}__` : `#${i+1}`}</span>
          <input type="text" class="opt-text" value="${escapeHtml(val || '')}" placeholder="${kind === 'blanks' ? 'Jawaban...' : 'Kata...'}" />
          <button type="button" class="del-opt" title="Hapus">×</button>
        </div>`;
    }

    function readForm(rowEl, type) {
      const get = (field) => {
        const el = rowEl.querySelector(`[data-field="${field}"]`);
        return el ? el.value : '';
      };
      const getList = (listName) => Array.from(rowEl.querySelectorAll(`[data-list="${listName}"] .option-row .opt-text`)).map(i => i.value);

      switch (type) {
        case 'tutorial_step': return { title: get('title'), body: get('body') };
        case 'var_test':      return { prompt: get('prompt'), hint: get('hint') };
        case 'simple_mc': {
          const options = getList('options');
          const correctIdx = Array.from(rowEl.querySelectorAll('[data-list="options"] .opt-correct')).findIndex(c => c.checked);
          return { question: get('question'), options, answer: correctIdx < 0 ? 0 : correctIdx };
        }
        case 'complex_mc': {
          const options = getList('options');
          const answers = Array.from(rowEl.querySelectorAll('[data-list="options"] .opt-correct'))
            .map((c, i) => c.checked ? i : -1).filter(i => i >= 0);
          return { question: get('question'), options, answers };
        }
        case 'true_false': {
          const activeBtn = rowEl.querySelector('.tf-toggle button.active');
          return { statement: get('statement'), answer: activeBtn ? activeBtn.dataset.tf === 'true' : true };
        }
        case 'word_bank':
          return { template: get('template'), bank: getList('bank'), blanks: getList('blanks') };
      }
      return {};
    }

    function validatePayload(type, payload) {
      switch (type) {
        case 'tutorial_step':
          if (!payload.title?.trim()) return 'Judul tidak boleh kosong';
          if (!payload.body?.trim())  return 'Isi penjelasan tidak boleh kosong';
          return null;
        case 'var_test':
          if (!payload.prompt?.trim()) return 'Instruksi tidak boleh kosong';
          return null;
        case 'simple_mc':
          if (!payload.question?.trim()) return 'Pertanyaan tidak boleh kosong';
          if ((payload.options || []).filter(o => o.trim()).length < 2) return 'Minimal 2 pilihan jawaban';
          if (payload.answer == null || payload.answer < 0) return 'Pilih satu jawaban benar';
          return null;
        case 'complex_mc':
          if (!payload.question?.trim()) return 'Pertanyaan tidak boleh kosong';
          if ((payload.options || []).filter(o => o.trim()).length < 2) return 'Minimal 2 pilihan jawaban';
          if (!payload.answers?.length) return 'Centang minimal satu jawaban benar';
          return null;
        case 'true_false':
          if (!payload.statement?.trim()) return 'Pernyataan tidak boleh kosong';
          return null;
        case 'word_bank':
          if (!payload.template?.trim()) return 'Template tidak boleh kosong';
          if (!payload.bank?.length || payload.bank.every(b => !b.trim())) return 'Bank kata tidak boleh kosong';
          if (!payload.blanks?.length) return 'Jawaban tidak boleh kosong';
          const matches = (payload.template.match(/__\d+__/g) || []).length;
          if (matches !== payload.blanks.length) return `Jumlah blank di template (${matches}) tidak cocok dengan jumlah jawaban (${payload.blanks.length})`;
          return null;
      }
      return null;
    }

    function wireFormEvents(card, q) {
      // Toggle "correct" highlight on option rows
      card.querySelectorAll('.opt-correct').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.type === 'radio') {
            card.querySelectorAll('[data-list="options"] .option-row').forEach(r => r.classList.remove('correct-row'));
          }
          cb.closest('.option-row').classList.toggle('correct-row', cb.checked);
        });
      });
      // Delete option
      card.querySelectorAll('.del-opt').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('.option-row').remove());
      });
      // Add option/bank/blank
      card.querySelectorAll('.add-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.add;
          const listName = target === 'option' ? 'options' : target;
          const list = card.querySelector(`[data-list="${listName}"]`);
          const idx = list.children.length;
          const html = (target === 'option')
            ? optionRow(idx, '', false, q.type)
            : wbWordRow(idx, '', listName);
          const tmp = document.createElement('div');
          tmp.innerHTML = html;
          const node = tmp.firstElementChild;
          list.appendChild(node);
          // wire delete
          node.querySelector('.del-opt').addEventListener('click', () => node.remove());
          const cb = node.querySelector('.opt-correct');
          if (cb) cb.addEventListener('change', () => {
            if (cb.type === 'radio') card.querySelectorAll('[data-list="options"] .option-row').forEach(r => r.classList.remove('correct-row'));
            node.classList.toggle('correct-row', cb.checked);
          });
          // Re-number word_bank blanks
          if (listName === 'blanks' || listName === 'bank') {
            Array.from(list.children).forEach((child, i) => {
              child.querySelector('.opt-mark').textContent = listName === 'blanks' ? `__${i+1}__` : `#${i+1}`;
            });
          }
        });
      });
      // True/False toggle
      card.querySelectorAll('.tf-toggle button').forEach(btn => {
        btn.addEventListener('click', () => {
          card.querySelectorAll('.tf-toggle button').forEach(b => b.classList.remove('active', 't', 'f'));
          btn.classList.add('active', btn.dataset.tf === 'true' ? 't' : 'f');
        });
      });
    }

    let currentOrder = []; // question ids in display order, for reorder persistence

    async function loadQuestions() {
      const simKey = document.getElementById('q-sim').value;
      if (!simKey) return;
      const { questions } = await API.get('/api/admin/questions?sim_key=' + encodeURIComponent(simKey));
      currentOrder = questions.map(q => q.id);

      const list = document.getElementById('q-list');
      const cards = questions.map((q, i) => `
        <div class="q-card" data-id="${q.id}" data-type="${q.type}">
          <div class="q-card-header">
            <span class="order-num">${i + 1}</span>
            <span class="type-label">${TYPE_META[q.type]?.icon || ''} ${TYPE_META[q.type]?.label || q.type}</span>
            <div class="actions">
              <button class="btn btn-secondary move-up"   title="Pindah ke atas"  ${i === 0 ? 'disabled' : ''}>↑</button>
              <button class="btn btn-secondary move-down" title="Pindah ke bawah" ${i === questions.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="btn btn-secondary edit-btn">✎ Edit</button>
              <button class="btn btn-bad del-btn">Hapus</button>
            </div>
          </div>
          <div class="q-card-body preview-body">${renderPreview(q)}</div>
        </div>`).join('');

      list.innerHTML = `
        ${cards || '<div class="muted" style="padding: 8px 14px; font-size: 13px;">Belum ada soal untuk simulasi ini.</div>'}
        <div style="display:flex; justify-content:center; margin-top: 12px;">
          <button class="btn" id="add-question-btn" style="padding: 10px 24px;">+ Tambah Soal</button>
        </div>`;

      list.querySelectorAll('.q-card').forEach(card => {
        const id = card.dataset.id;
        const q = questions.find(x => String(x.id) === id);

        card.querySelector('.edit-btn').addEventListener('click', () => openEdit(card, q));
        card.querySelector('.del-btn').addEventListener('click', async () => {
          if (!confirm(`Hapus soal "${(q.payload.title || q.payload.question || q.payload.statement || q.payload.prompt || q.payload.template || '').slice(0, 50)}…" ?`)) return;
          await API.del('/api/admin/questions/' + id);
          loadQuestions();
        });
        card.querySelector('.move-up').addEventListener('click', () => moveQuestion(q.id, -1));
        card.querySelector('.move-down').addEventListener('click', () => moveQuestion(q.id, +1));
      });

      document.getElementById('add-question-btn').addEventListener('click', openNewQuestionModal);
    }

    async function moveQuestion(id, delta) {
      const i = currentOrder.indexOf(id);
      const j = i + delta;
      if (i < 0 || j < 0 || j >= currentOrder.length) return;
      [currentOrder[i], currentOrder[j]] = [currentOrder[j], currentOrder[i]];
      await API.post('/api/admin/questions/reorder', { ids: currentOrder });
      loadQuestions();
    }

    function openEdit(card, q) {
      card.classList.add('editing');
      const previewBody = card.querySelector('.preview-body');
      previewBody.innerHTML = `
        <div class="q-edit-form">
          ${renderForm(q)}
          <details class="json-advanced">
            <summary>Lihat / edit JSON mentah (lanjutan)</summary>
            <pre>${escapeHtml(JSON.stringify(q.payload, null, 2))}</pre>
          </details>
          <div class="form-actions">
            <button class="btn btn-secondary cancel-btn">Batal</button>
            <button class="btn save-btn">💾 Simpan</button>
          </div>
        </div>`;
      const form = previewBody.querySelector('.q-edit-form');
      wireFormEvents(form, q);

      form.querySelector('.cancel-btn').addEventListener('click', () => loadQuestions());
      form.querySelector('.save-btn').addEventListener('click', async () => {
        const payload = readForm(form, q.type);
        const err = validatePayload(q.type, payload);
        if (err) { alert(err); return; }
        try {
          await API.put('/api/admin/questions/' + q.id, { payload });
          loadQuestions();
        } catch (e) { alert('Gagal simpan: ' + e.message); }
      });
    }

    function openNewQuestionModal() {
      const simKey = document.getElementById('q-sim').value;

      const modal = document.createElement('div');
      modal.className = 'new-q-modal';
      modal.innerHTML = `
        <div class="modal-card">
          <h3>Tambah Soal</h3>
          <p class="muted" style="font-size:13px;">Pilih jenis soal — soal akan ditambahkan di akhir, gunakan ↑↓ untuk memindah posisi:</p>
          <div class="type-grid">
            ${Object.entries(TYPE_META).map(([k, m]) => `
              <button data-type="${k}">
                <span class="t-icon">${m.icon}</span>
                <span class="t-label">${m.label}</span>
              </button>`).join('')}
          </div>
          <div style="display:flex;justify-content:flex-end;">
            <button class="btn btn-secondary close-modal">Batal</button>
          </div>
        </div>`;
      document.body.appendChild(modal);

      modal.querySelector('.close-modal').addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      modal.querySelectorAll('.type-grid button').forEach(b => {
        b.addEventListener('click', async () => {
          const type = b.dataset.type;
          modal.remove();
          // Stage is derived from type — kept for analytics/back-compat only.
          const stage = TYPE_META[type].stage;
          const r = await API.post('/api/admin/questions', {
            sim_key: simKey,
            stage,
            type,
            order_index: currentOrder.length, // append at the end
            payload: defaultPayload(type)
          });
          await loadQuestions();
          const newCard = document.querySelector(`.q-card[data-id="${r.id}"]`);
          if (newCard) {
            const q = { id: r.id, sim_key: simKey, stage, type, order_index: currentOrder.length, payload: defaultPayload(type) };
            openEdit(newCard, q);
            newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      });
    }

    async function loadResponses() {
      const { responses } = await API.get('/api/admin/responses');
      const html = `
        <table><thead><tr><th>Waktu</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Sim</th><th>Tahap</th><th>Tipe</th><th>Benar?</th><th>Jawaban</th></tr></thead><tbody>
        ${responses.map(r => `
          <tr>
            <td style="font-size:11px;">${new Date(r.submitted_at).toLocaleString('id-ID')}</td>
            <td>${r.nis}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.class_name||'')}</td>
            <td>${r.sim_key}</td><td>${r.stage}</td><td>${r.type}</td>
            <td>${r.is_correct === true ? '<span class="tag ok">✓</span>' : r.is_correct === false ? '<span class="tag no">✗</span>' : '<span class="tag mid">—</span>'}</td>
            <td style="font-size:11px;">${escapeHtml(JSON.stringify(r.answer))}</td>
          </tr>`).join('')}
        </tbody></table>
      `;
      document.getElementById('resp-table').innerHTML = html;
    }

    async function loadSummary() {
      const { students } = await API.get('/api/admin/summary');
      const html = `
        <table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Sim Selesai</th><th>Total Jawaban</th><th>Benar</th></tr></thead><tbody>
        ${students.map(s => `<tr><td>${s.nis}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.class_name||'')}</td><td>${s.sims_completed}/6</td><td>${s.answers}</td><td>${s.correct}</td></tr>`).join('')}
        </tbody></table>
      `;
      document.getElementById('summary-table').innerHTML = html;
    }

    checkAuth();
  </script>
</body>
</html>
