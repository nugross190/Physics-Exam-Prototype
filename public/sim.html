<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulasi — Ujian Fisika</title>
  <link rel="stylesheet" href="/shared/overlay.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Top bar -->
  <div class="sim-topbar">
    <div class="left">
      <a href="/dashboard.html">← Dashboard</a>
      <strong id="sim-title">Memuat...</strong>
    </div>
    <div class="right" id="topbar-right">
      <button id="toggle-quiz" title="Sembunyikan/tampilkan panel quiz">◀ Sembunyikan Quiz</button>
    </div>
  </div>

  <!-- Split layout -->
  <div id="sim-layout">
    <div id="sim-pane">
      <iframe id="sim-host" src="about:blank" allow="fullscreen" allowfullscreen></iframe>
    </div>
    <div id="quiz-pane">
      <!-- quiz panel injected here by overlay.js -->
    </div>
  </div>

  <!-- Mobile floating fallback (hidden on desktop, shown on narrow screens) -->
  <div id="mobile-overlay-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/overlay.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const key = params.get('key');
      const isPreview = params.get('preview') === '1';
      if (!key) { window.location.href = '/dashboard.html'; return; }

      // In preview mode the admin cookie is used; no student session needed.
      const endpoint = isPreview
        ? `/api/admin/sim/${encodeURIComponent(key)}/preview`
        : `/api/quest/sim/${encodeURIComponent(key)}`;

      let meta;
      try {
        meta = await API.get(endpoint);
      } catch (err) {
        alert(err.message);
        window.location.href = isPreview ? '/admin.html' : '/dashboard.html';
        return;
      }

      const isTestMode = !isPreview && !!meta.test_mode;

      document.getElementById('sim-title').textContent =
        meta.sim.title + (isPreview ? ' — MODE PREVIEW' : '') + (isTestMode ? ' — MODE TEST' : '');
      document.getElementById('sim-host').src = meta.sim.embed_path;

      if (isPreview) {
        const banner = document.createElement('div');
        banner.id = 'preview-banner';
        banner.style.cssText = 'background:#f59e0b;color:#78350f;font-weight:700;font-size:12px;text-align:center;padding:4px 8px;position:fixed;top:0;left:0;right:0;z-index:200;letter-spacing:.03em;';
        banner.textContent = '⚠ MODE PREVIEW — jawaban tidak direkam';
        document.body.prepend(banner);
        document.querySelector('.sim-topbar').style.top = banner.offsetHeight + 'px';
        document.getElementById('sim-layout').style.top = (44 + banner.offsetHeight) + 'px';
      }

      if (isTestMode) {
        // Test mode: hide quiz pane, give full width to sim, remove toggle button
        const banner = document.createElement('div');
        banner.style.cssText = 'background:#2563eb;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:4px 8px;position:fixed;top:0;left:0;right:0;z-index:200;letter-spacing:.03em;';
        banner.textContent = 'MODE TEST — jelajahi simulasi bebas. Soal tidak ditampilkan.';
        document.body.prepend(banner);
        document.querySelector('.sim-topbar').style.top = banner.offsetHeight + 'px';
        document.getElementById('sim-layout').style.top = (44 + banner.offsetHeight) + 'px';
        document.getElementById('sim-layout').classList.add('quiz-collapsed');
        document.getElementById('topbar-right').style.display = 'none';
        return;
      }

      await QuizOverlay.init(key, { previewMode: isPreview, previewData: isPreview ? meta : null });

      // Topbar toggle: collapse/expand the quiz pane
      const toggleBtn = document.getElementById('toggle-quiz');
      toggleBtn.addEventListener('click', () => {
        const layout = document.getElementById('sim-layout');
        const collapsed = layout.classList.toggle('quiz-collapsed');
        toggleBtn.textContent = collapsed ? '▶ Buka Quiz' : '◀ Sembunyikan Quiz';
      });
    })();
  </script>
</body>
</html>
